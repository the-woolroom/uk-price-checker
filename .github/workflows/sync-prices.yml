name: Sync UK/ROW Prices

on:
  schedule:
    - cron: '0 4,10,16,22 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync prices from Shopify
        run: node scripts/sync-prices.js

      - name: Commit and push if changed
        run: |
          git config user.name "price-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add price-history.json
          if git diff --cached --quiet; then
            echo "No price changes."
          else
            git commit -m "Automated price sync $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
